<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="svgtitle">
<title id="svgtitle">About Chirag</title>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#101a39"/></linearGradient>
 <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#247bff"/><stop offset="0.55" stop-color="#9b5cff"/><stop offset="1" stop-color="#ff354f"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>
 .title{font:700 34px Arial,sans-serif;fill:#f5f7ff}
 .body{font:16px Arial,sans-serif;fill:#c3cbe0}
 .mono{font:14px monospace;fill:#74e5ff}
 .enter{opacity:0;animation:fadein .9s ease-out .15s forwards}
 @keyframes fadein{to{opacity:1}}
 @media (prefers-reduced-motion: reduce){.enter{animation:none;opacity:1} .pulse{animation:none}}
 </style>
</defs>
<rect width="1000" height="340" rx="24" fill="url(#bg)"/>
<rect x="2" y="2" width="996" height="336" rx="22" fill="none" stroke="url(#neon)" stroke-width="2"/>

<text x="40" y="52" class="mono" letter-spacing="3">01 / ABOUT ME</text>
<text x="40" y="101" class="title">Curious mind. Practical builder.</text>
<text x="40" y="143" class="body">I explore AI/ML and automation to turn useful ideas into practical tools.</text>
<text x="40" y="172" class="body">My interests include intelligent systems, workflow automation, and data-driven</text>
<text x="40" y="201" class="body">problem solving. This profile will grow with the projects I build and share.</text>
<rect x="40" y="238" width="290" height="48" rx="12" fill="#111e3e" stroke="#247bff"/>
<text x="185" y="267" text-anchor="middle" class="mono">LEARN  /  BUILD  /  AUTOMATE</text>
<circle cx="785" cy="170" r="99" fill="#0c1632" stroke="url(#neon)" stroke-width="3"/>
<circle cx="785" cy="170" r="73" fill="none" stroke="#247bff" stroke-width="2" stroke-dasharray="7 8">
 <animateTransform attributeName="transform" type="rotate" from="0 785 170" to="360 785 170" dur="32s" repeatCount="indefinite"/>
</circle>
<text x="785" y="158" text-anchor="middle" fill="#f5f7ff" font-family="Arial" font-size="21" font-weight="700">AI / ML</text>
<text x="785" y="186" text-anchor="middle" class="mono">AUTOMATION</text>
</svg>